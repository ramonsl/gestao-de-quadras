name: CI

# Gate antes do deploy: roda os mesmos passos que quebrariam o build no Coolify.
on:
  pull_request:
    branches: [dev, homolog, main]
  push:
    branches: [dev, homolog, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # O `next build` importa módulos que exigem estas envs no boot; valores
      # fake bastam para o build/typecheck (não há acesso a banco no build).
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret
      NEXTAUTH_SECRET: ci-dummy-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (ci, com devDependencies)
        run: npm ci --include=dev

      - name: Testes unitários (Vitest)
        run: npm run test

      - name: Build do app (next build — mesma checagem de tipos do deploy)
        run: npm run build --workspace=apps/web
