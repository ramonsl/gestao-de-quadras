<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260">
  <!-- ícone: quadra (cancha) vista de cima formando um K -->
  <g>
    <rect x="30" y="30" width="200" height="200" rx="48" fill="#C4713B"/>
    <!-- quadra -->
    <rect x="62" y="58" width="136" height="144" rx="14" fill="none" stroke="#FFFFFF" stroke-width="9"/>
    <!-- linha central (rede) -->
    <line x1="62" y1="130" x2="198" y2="130" stroke="#FFFFFF" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- áreas de saque -->
    <line x1="130" y1="58" x2="130" y2="102" stroke="#FFFFFF" stroke-width="7"/>
    <line x1="130" y1="158" x2="130" y2="202" stroke="#FFFFFF" stroke-width="7"/>
    <line x1="62" y1="102" x2="198" y2="102" stroke="#FFFFFF" stroke-width="7"/>
    <line x1="62" y1="158" x2="198" y2="158" stroke="#FFFFFF" stroke-width="7"/>
    <!-- bola -->
    <circle cx="198" cy="130" r="17" fill="#10283F" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- wordmark -->
  <text x="270" y="165" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" fill="#10283F" letter-spacing="-1">kancha</text>
  <text x="276" y="208" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#C4713B" letter-spacing="10">GESTÃO DE ARENAS</text>
</svg>
