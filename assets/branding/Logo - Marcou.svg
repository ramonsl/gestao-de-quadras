<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260">
  <!-- ícone: check que é a trajetória da bola quicando -->
  <g>
    <rect x="30" y="30" width="200" height="200" rx="48" fill="#3FA34D"/>
    <!-- trajetória: bola desce, quica (vértice do check) e sobe -->
    <path d="M66 118 L118 176 L196 84" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bola no fim da trajetória -->
    <circle cx="196" cy="84" r="20" fill="#10283F" stroke="#FFFFFF" stroke-width="6"/>
    <!-- marca do quique -->
    <path d="M104 196 L132 196" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- wordmark -->
  <text x="270" y="165" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" fill="#10283F" letter-spacing="-1">marcou<tspan fill="#3FA34D">!</tspan></text>
  <text x="276" y="206" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#3FA34D" letter-spacing="5">RESERVOU · JOGOU · PONTUOU</text>
</svg>
