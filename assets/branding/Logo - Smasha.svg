<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260">
  <!-- fundo transparente -->
  <!-- ícone: bola em smash com rastros de velocidade -->
  <g>
    <rect x="30" y="30" width="200" height="200" rx="48" fill="#10283F"/>
    <!-- rastros -->
    <path d="M70 70 Q120 85 158 128" fill="none" stroke="#8FD14F" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <path d="M62 98 Q108 110 142 146" fill="none" stroke="#8FD14F" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <path d="M58 128 Q98 136 128 164" fill="none" stroke="#8FD14F" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <!-- bola -->
    <circle cx="172" cy="168" r="34" fill="#8FD14F"/>
    <path d="M150 143 q22 25 44 50" stroke="#10283F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- impacto -->
    <path d="M196 205 L214 223 M206 190 L226 204" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="270" y="165" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" font-style="italic" fill="#10283F" letter-spacing="-2">smasha</text>
  <text x="276" y="208" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#3FA34D" letter-spacing="10">GESTÃO DE ARENAS</text>
</svg>
