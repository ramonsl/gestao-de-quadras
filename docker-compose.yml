version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestao_de_quadras_postgres
    restart: always
    environment:
      POSTGRES_USER: gestao_user
      POSTGRES_PASSWORD: gestao_password
      POSTGRES_DB: gestao_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gestao_de_quadras_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
